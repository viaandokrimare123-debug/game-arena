<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Underground Zombie Survival</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080810;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
    background: #11131a;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 20;
    background: rgba(5,5,10,.85);
    padding: 12px 16px;
    border: 1px solid #444;
    border-radius: 10px;
    font-size: 16px;
}

#help {
    position: fixed;
    bottom: 15px;
    left: 15px;
    z-index: 20;
    background: rgba(5,5,10,.75);
    padding: 10px 14px;
    border-radius: 8px;
    color: #ccc;
}

#gameOver {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.8);
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

#gameOver h1 {
    color: #ff3333;
    font-size: 60px;
    margin: 10px;
}

#gameOver button {
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    ❤️ Health: <span id="health">100</span>
    &nbsp;&nbsp;
    🔫 Ammo: <span id="ammo">60</span>
    &nbsp;&nbsp;
    🧟 Zombies: <span id="zombies">0</span>
</div>

<div id="help">
    WASD / Arrow Keys = Move &nbsp; | &nbsp;
    SPACE = Jump &nbsp; | &nbsp;
    Mouse = Aim &nbsp; | &nbsp;
    Left Click = Shoot
</div>

<div id="gameOver">
    <h1>YOU DIED</h1>
    <p>The zombies got you.</p>
    <button onclick="location.reload()">RESTART</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

/* =========================
   WORLD
========================= */

const world = {
    width: 5000,
    floor: 560
};

/* =========================
   PLAYER
========================= */

const player = {
    x: 400,
    y: 400,

    width: 32,
    height: 55,

    vx: 0,
    vy: 0,

    speed: 4,
    jumpPower: 13,

    grounded: false,

    health: 100,
    ammo: 60,

    facing: 1
};

/* =========================
   INPUT
========================= */

const keys = {};

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        e.preventDefault();

        if (player.grounded) {
            player.vy = -player.jumpPower;
            player.grounded = false;
        }
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

/* =========================
   MOUSE
========================= */

const mouse = {
    x: 0,
    y: 0,
    down: false
};

canvas.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

canvas.addEventListener("mousedown", () => {
    mouse.down = true;
});

window.addEventListener("mouseup", () => {
    mouse.down = false;
});

/* =========================
   BOXES
========================= */

const boxes = [
    {x: 700, y: 480, w: 100, h: 80},
    {x: 900, y: 400, w: 100, h: 160},

    {x: 1250, y: 470, w: 110, h: 90},
    {x: 1450, y: 380, w: 110, h: 180},

    {x: 1900, y: 460, w: 100, h: 100},
    {x: 2050, y: 380, w: 100, h: 180},

    {x: 2600, y: 450, w: 130, h: 110},
    {x: 2850, y: 350, w: 120, h: 210},

    {x: 3300, y: 470, w: 110, h: 90},
    {x: 3500, y: 400, w: 110, h: 160},

    {x: 4000, y: 450, w: 130, h: 110},
    {x: 4250, y: 350, w: 120, h: 210}
];

/* =========================
   ZOMBIES
========================= */

const zombies = [];

function spawnZombie(x, y) {
    zombies.push({
        x,
        y,
        width: 35,
        height: 55,

        vx: 0,
        vy: 0,

        health: 100,
        speed: 1.2,

        grounded: false,

        attackCooldown: 0
    });
}

spawnZombie(1100, 505);
spawnZombie(1600, 505);
spawnZombie(2200, 505);
spawnZombie(2450, 505);
spawnZombie(3100, 505);
spawnZombie(3700, 505);
spawnZombie(4500, 505);

/* =========================
   BULLETS
========================= */

const bullets = [];

function shoot() {

    if (player.ammo <= 0) return;

    player.ammo--;

    const worldMouseX =
        mouse.x + camera.x;

    const worldMouseY =
        mouse.y + camera.y;

    const dx =
        worldMouseX -
        (player.x + player.width / 2);

    const dy =
        worldMouseY -
        (player.y + player.height / 2);

    const length = Math.sqrt(dx * dx + dy * dy);

    bullets.push({
        x: player.x + player.width / 2,
        y: player.y + player.height / 2,

        vx: dx / length * 12,
        vy: dy / length * 12,

        life: 100
    });
}

let shootCooldown = 0;

/* =========================
   COLLISION
========================= */

function overlap(a, b) {

    return (
        a.x < b.x + b.w &&
        a.x + a.width > b.x &&
        a.y < b.y + b.h &&
        a.y + a.height > b.y
    );
}

/*
    IMPORTANT:
    The floor is ALWAYS solid.

    This prevents the player from falling
    underneath the map.
*/

function resolvePlayerCollision() {

    player.grounded = false;

    /* FLOOR */

    if (player.y + player.height >= world.floor) {

        player.y = world.floor - player.height;
        player.vy = 0;
        player.grounded = true;
    }

    /* BOXES */

    for (const box of boxes) {

        const playerBottom =
            player.y + player.height;

        const playerPreviousBottom =
            playerBottom - player.vy;

        const horizontal =
            player.x + player.width > box.x &&
            player.x < box.x + box.w;

        /*
            Landing on top of box
        */

        if (
            horizontal &&
            playerPreviousBottom <= box.y &&
            playerBottom >= box.y &&
            player.vy >= 0
        ) {

            player.y = box.y - player.height;
            player.vy = 0;
            player.grounded = true;
        }

        /*
            Hit underside of box
        */

        if (
            horizontal &&
            player.y < box.y + box.h &&
            playerBottom > box.y + box.h &&
            player.vy < 0
        ) {

            player.y = box.y + box.h;
            player.vy = 0;
        }
    }

    /* HARD WORLD LIMIT */

    if (player.y < 0) {
        player.y = 0;
        player.vy = 0;
    }
}

/* =========================
   ZOMBIE COLLISION
========================= */

function resolveZombieCollision(z) {

    z.grounded = false;

    /* FLOOR */

    if (z.y + z.height >= world.floor) {

        z.y = world.floor - z.height;
        z.vy = 0;
        z.grounded = true;
    }

    /* BOXES */

    for (const box of boxes) {

        const bottom = z.y + z.height;
        const previousBottom = bottom - z.vy;

        const horizontal =
            z.x + z.width > box.x &&
            z.x < box.x + box.w;

        if (
            horizontal &&
            previousBottom <= box.y &&
            bottom >= box.y &&
            z.vy >= 0
        ) {

            z.y = box.y - z.height;
            z.vy = 0;
            z.grounded = true;
        }
    }
}

/* =========================
   CAMERA
========================= */

const camera = {
    x: 0,
    y: 0
};

/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer() {

    let move = 0;

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        move -= 1;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        move += 1;
    }

    player.vx = move * player.speed;

    if (move !== 0) {
        player.facing = move;
    }

    player.x += player.vx;

    /* WORLD WALLS */

    if (player.x < 0) {
        player.x = 0;
    }

    if (
        player.x + player.width >
        world.width
    ) {
        player.x =
            world.width - player.width;
    }

    /* GRAVITY */

    player.vy += 0.6;

    player.y += player.vy;

    resolvePlayerCollision();

    /* CAMERA */

    camera.x =
        player.x -
        canvas.width / 2 +
        player.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;

    camera.x =
        Math.max(
            0,
            Math.min(
                camera.x,
                world.width - canvas.width
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                camera.y,
                560 - canvas.height
            )
        );
}

/* =========================
   UPDATE ZOMBIES
========================= */

function updateZombies() {

    for (let i = zombies.length - 1; i >= 0; i--) {

        const z = zombies[i];

        const dx =
            player.x - z.x;

        /*
            Zombies chase player.
        */

        if (Math.abs(dx) > 10) {

            z.vx =
                Math.sign(dx) *
                z.speed;
        }
        else {

            z.vx = 0;
        }

        /*
            Zombies can jump onto boxes.
        */

        if (
            z.grounded &&
            Math.abs(dx) < 250
        ) {

            const boxAhead = boxes.some(box => {

                return (
                    z.x + z.width > box.x &&
                    z.x < box.x + box.w &&
                    Math.abs(
                        (z.y + z.height) - box.y
                    ) < 20
                );
            });

            if (boxAhead) {
                z.vy = -11;
                z.grounded = false;
            }
        }

        z.x += z.vx;

        z.vy += 0.6;
        z.y += z.vy;

        resolveZombieCollision(z);

        /* ZOMBIE ATTACK */

        if (
            z.attackCooldown > 0
        ) {
            z.attackCooldown--;
        }

        if (
            overlap(
                player,
                {
                    x: z.x,
                    y: z.y,
                    w: z.width,
                    h: z.height
                }
            )
            &&
            z.attackCooldown <= 0
        ) {

            player.health -= 10;

            z.attackCooldown = 45;

            if (player.health <= 0) {

                player.health = 0;

                document.getElementById(
                    "gameOver"
                ).style.display = "flex";
            }
        }
    }
}

/* =========================
   UPDATE BULLETS
========================= */

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const b = bullets[i];

        b.x += b.vx;
        b.y += b.vy;

        b.life--;

        let remove = false;

        /* BOX COLLISION */

        for (const box of boxes) {

            if (
                b.x > box.x &&
                b.x < box.x + box.w &&
                b.y > box.y &&
                b.y < box.y + box.h
            ) {

                remove = true;
                break;
            }
        }

        /* ZOMBIE COLLISION */

        for (
            let j = zombies.length - 1;
            j >= 0;
            j--
        ) {

            const z = zombies[j];

            if (
                b.x > z.x &&
                b.x < z.x + z.width &&
                b.y > z.y &&
                b.y < z.y + z.height
            ) {

                z.health -= 50;

                remove = true;

                if (z.health <= 0) {
                    zombies.splice(j, 1);
                }

                break;
            }
        }

        if (
            b.life <= 0 ||
            b.x < 0 ||
            b.x > world.width
        ) {
            remove = true;
        }

        if (remove) {
            bullets.splice(i, 1);
        }
    }
}

/* =========================
   DRAW WORLD
========================= */

function drawWorld() {

    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );

    /* BACKGROUND */

    ctx.fillStyle = "#10121a";

    ctx.fillRect(
        0,
        0,
        world.width,
        560
    );

    /* CEILING */

    ctx.fillStyle = "#20232d";

    ctx.fillRect(
        0,
        0,
        world.width,
        40
    );

    /* WALL DETAILS */

    for (
        let x = 0;
        x < world.width;
        x += 100
    ) {

        ctx.strokeStyle = "#292c37";

        ctx.beginPath();

        ctx.moveTo(x, 40);
        ctx.lineTo(x + 20, 560);

        ctx.stroke();
    }

    /* FLOOR */

    ctx.fillStyle = "#29221d";

    ctx.fillRect(
        0,
        world.floor,
        world.width,
        100
    );

    /* FLOOR LINE */

    ctx.fillStyle = "#55504a";

    ctx.fillRect(
        0,
        world.floor,
        world.width,
        5
    );

    /* BOXES */

    for (const box of boxes) {

        ctx.fillStyle = "#80542d";

        ctx.fillRect(
            box.x,
            box.y,
            box.w,
            box.h
        );

        ctx.strokeStyle = "#c28a4c";
        ctx.lineWidth = 3;

        ctx.strokeRect(
            box.x,
            box.y,
            box.w,
            box.h
        );

        /* X MARK */

        ctx.beginPath();

        ctx.moveTo(
            box.x + 10,
            box.y + 10
        );

        ctx.lineTo(
            box.x + box.w - 10,
            box.y + box.h - 10
        );

        ctx.moveTo(
            box.x + box.w - 10,
            box.y + 10
        );

        ctx.lineTo(
            box.x + 10,
            box.y + box.h - 10
        );

        ctx.stroke();
    }

    /* PLAYER */

    drawPlayer();

    /* ZOMBIES */

    for (const z of zombies) {

        ctx.fillStyle = "#55a63b";

        ctx.fillRect(
            z.x,
            z.y,
            z.width,
            z.height
        );

        /* HEAD */

        ctx.fillStyle = "#7fc45a";

        ctx.fillRect(
            z.x + 4,
            z.y - 20,
            27,
            25
        );

        /* EYES */

        ctx.fillStyle = "red";

        ctx.fillRect(
            z.x + 9,
            z.y - 12,
            5,
            5
        );

        ctx.fillRect(
            z.x + 21,
            z.y - 12,
            5,
            5
        );

        /* HEALTH BAR */

        ctx.fillStyle = "#222";

        ctx.fillRect(
            z.x,
            z.y - 28,
            z.width,
            5
        );

        ctx.fillStyle = "#e33";

        ctx.fillRect(
            z.x,
            z.y - 28,
            z.width *
            (z.health / 100),
            5
        );
    }

    /* BULLETS */

    for (const b of bullets) {

        ctx.fillStyle = "#ffd34d";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}

/* =========================
   PLAYER DRAW
========================= */

function drawPlayer() {

    /* BODY */

    ctx.fillStyle = "#3b6cff";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    /* HEAD */

    ctx.fillStyle = "#e0ad7c";

    ctx.fillRect(
        player.x + 4,
        player.y - 22,
        25,
        25
    );

    /* HAIR */

    ctx.fillStyle = "#222";

    ctx.fillRect(
        player.x + 3,
        player.y - 25,
        27,
        9
    );

    /* GUN */

    ctx.fillStyle = "#444";

    if (player.facing > 0) {

        ctx.fillRect(
            player.x + 28,
            player.y + 20,
            25,
            8
        );

    } else {

        ctx.fillRect(
            player.x - 25,
            player.y + 20,
            25,
            8
        );
    }
}

/* =========================
   SHOOTING
========================= */

function updateShooting() {

    if (shootCooldown > 0) {
        shootCooldown--;
    }

    if (
        mouse.down &&
        shootCooldown <= 0
    ) {

        shoot();

        shootCooldown = 12;
    }
}

/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById(
        "health"
    ).textContent =
        Math.max(
            0,
            Math.floor(player.health)
        );

    document.getElementById(
        "ammo"
    ).textContent =
        player.ammo;

    document.getElementById(
        "zombies"
    ).textContent =
        zombies.length;
}

/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    updatePlayer();

    updateZombies();

    updateBullets();

    updateShooting();

    updateHUD();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawWorld();

    requestAnimationFrame(
        gameLoop
    );
}

gameLoop();

</script>

</body>
</html>
